<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The RSI Loop: a self-improving detector proposes new thresholds; Stage 1 checks accuracy against labelled benchmarks (below 90 percent the audit never runs); Stage 2 audits the surviving thresholds against the Clinical Gold Standard — in range is accepted as COMPLETE, outside is rejected as NOT_COMPLIANT and the iteration returns to the optimiser. Passing the test is necessary but not sufficient.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#767d86"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker></defs>
<rect x="16" y="52" width="230" height="448" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="34" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">THE LOOP &#183; SELF-IMPROVING</text>
<rect x="36.0" y="110" width="190" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="131" y="132" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Detector vN</text>
<text x="131" y="150" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">two tunable thresholds</text>
<rect x="36.0" y="350" width="190" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="131" y="372" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Optimiser</text>
<text x="131" y="390" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">mutates the thresholds</text>
<polyline points="131,350 131,164" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="141" y="262" font-size="11" fill="#9198a1">deploy vN+1</text>
<polyline points="226,136 258,136 258,228 304,228" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="250" y="186" font-size="10.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" fill="#9198a1" text-anchor="middle" transform="rotate(-90 250 186)">assess(landmarks)</text>
<rect x="276" y="52" width="310" height="448" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="294" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">STAGE 1 &#183; ACCURACY</text>
<rect x="306.0" y="100" width="250" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="431" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">benchmarks.json</text>
<text x="431" y="140" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">10 labelled scenarios</text>
<polyline points="431,152 431,198" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="441" y="180" font-size="11" fill="#9198a1">expected</text>
<rect x="306.0" y="200" width="250" height="56" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="431" y="222" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Accuracy gate</text>
<text x="431" y="240" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">precision &#183; recall &#183; F1 &#183; accuracy</text>
<polyline points="431,256 431,298" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="441" y="282" font-size="11" font-weight="600" fill="#f85149">&lt; 90%</text>
<rect x="316.0" y="300" width="230" height="48" rx="8" fill="#3c1618" stroke="#6e2a2c"/>
<text x="431" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="#f85149">NOT_ACCURATE</text>
<text x="431" y="340" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">the audit never runs</text>
<polyline points="556,228 616,228 616,228 643,228" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="600" y="220" font-size="11" font-weight="600" fill="#3fb950" text-anchor="middle">&#8805; 90%</text>
<rect x="616" y="52" width="328" height="448" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="634" y="78" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9198a1">STAGE 2 &#183; COMPLIANCE</text>
<rect x="640.0" y="100" width="280" height="52" rx="8" fill="#212830" stroke="#3d444d"/>
<text x="780" y="122" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Clinical Gold Standard</text>
<text x="780" y="140" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">head 15&#8211;25&#176; &#183; wrist 40&#8211;60&#176; (&#177;5&#176; band)</text>
<polyline points="780,152 780,198" fill="none" stroke="#767d86" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="645.0" y="200" width="270" height="56" rx="8" fill="#2a2139" stroke="#ab7df8"/>
<text x="780" y="222" font-size="13" font-weight="600" text-anchor="middle" fill="#ab7df8">Auditor</text>
<text x="780" y="240" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">live thresholds vs the gold standard</text>
<polyline points="700,256 700,298" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="690" y="282" font-size="11" font-weight="600" fill="#3fb950" text-anchor="end">in range</text>
<rect x="615.0" y="300" width="150" height="48" rx="8" fill="#122117" stroke="#2b5233"/>
<text x="690" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="#3fb950">COMPLETE</text>
<text x="690" y="340" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">vN accepted</text>
<polyline points="860,256 860,298" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="870" y="282" font-size="11" font-weight="600" fill="#f85149" text-anchor="start">outside</text>
<rect x="772.0" y="300" width="166" height="48" rx="8" fill="#3c1618" stroke="#6e2a2c"/>
<text x="855" y="322" font-size="13" font-weight="600" text-anchor="middle" fill="#f85149">NOT_COMPLIANT</text>
<text x="855" y="340" font-size="11" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#9198a1">reward hack rejected</text>
<text x="634" y="482" font-size="11" font-style="italic" fill="#9198a1">67&#176; passes the benchmark &#8212; and dies here</text>
<polyline points="855,348 855,430 431,430" fill="none" stroke="#f85149" stroke-width="1.5"/>
<line x1="431" y1="348" x2="431" y2="430" stroke="#f85149" stroke-width="1.5"/>
<polyline points="431,430 258,430 258,376 228,376" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="620" y="422" font-size="11" font-weight="600" fill="#f85149" text-anchor="middle">iteration rejected &#8212; tune and retry</text>
</svg>